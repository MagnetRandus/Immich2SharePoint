name: Repository safety scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan all tracked Git blobs
        run: python3 scripts/security_scan.py --tracked
